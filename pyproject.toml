[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oaht-bench"
version = "0.1.0"
description = "A survey and benchmark for offline ad-hoc teamwork"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}

dependencies = [
    # --- ours ---
    "pydantic>=2.7",
    "h5py>=3.10",
    # --- inherited with the absorbed jax-aht code (PROVENANCE.md) ---
    # Pinned to the JAX AI stack v2025.2.5 versions the absorbed code was
    # written against. Bumping these can change environment dynamics, which
    # invalidates collected datasets and trained populations.
    "jax[cuda12]==0.5.3; platform_system == 'Linux'",
    "jax==0.5.3; platform_system == 'Darwin'",
    "chex==0.1.88",
    "flax==0.10.2",
    "ml_dtypes==0.4.0",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.1",
    "jumanji==1.1.0",
    "jaxmarl==0.0.7",
    "distrax",
    "gymnax",
    "numpy",
    "pandas<=2.3.3",
    "safetensors",
    "huggingface-hub",
    "omegaconf",
    "hydra-core",
    "matplotlib",
    "prettytable",
    "rliable",  # IQM aggregation for BR-Prox (§8)
    "wandb",
    "setuptools<81",
]

[project.scripts]
oaht-bench = "oaht_bench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oaht_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is importable so tests can check the config generator's scaling rules
pythonpath = ["."]
